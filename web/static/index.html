<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inner Companion</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#1a1a2e;color:#e0e0e0;height:100vh;display:flex;flex-direction:column}
#header{padding:12px 16px;background:#16213e;border-bottom:1px solid #0f3460;font-size:14px;font-weight:600;color:#94a3b8}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:#0f3460;color:#e2e8f0}
.msg.assistant{align-self:flex-start;background:#1e293b;color:#cbd5e1}
.msg.error{align-self:center;background:#7f1d1d;color:#fca5a5;font-size:12px}
#input-area{padding:12px 16px;background:#16213e;border-top:1px solid #0f3460;display:flex;gap:8px}
#input{flex:1;padding:10px 14px;border:1px solid #334155;border-radius:8px;background:#0f172a;color:#e2e8f0;font-size:14px;outline:none;resize:none;max-height:120px;font-family:inherit}
#input:focus{border-color:#3b82f6}
#send{padding:10px 20px;border:none;border-radius:8px;background:#3b82f6;color:#fff;font-size:14px;cursor:pointer;font-weight:500}
#send:hover{background:#2563eb}
#send:disabled{background:#334155;cursor:not-allowed}
</style>
</head>
<body>
<div id="header">Inner Companion</div>
<div id="messages"></div>
<div id="input-area">
<textarea id="input" rows="1" placeholder="Type a message..."></textarea>
<button id="send">Send</button>
</div>
<script>
(function(){
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  function getSessionID(){
    let sid = localStorage.getItem('session_id');
    if(!sid){
      sid = crypto.randomUUID();
      localStorage.setItem('session_id', sid);
    }
    return sid;
  }

  function getToken(){
    const params = new URLSearchParams(window.location.search);
    return params.get('token') || '';
  }

  function addMessage(text, cls){
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function genMsgID(){
    return crypto.randomUUID();
  }

  async function send(){
    const text = inputEl.value.trim();
    if(!text) return;
    inputEl.value = '';
    inputEl.style.height = 'auto';
    addMessage(text, 'user');
    sendBtn.disabled = true;

    const token = getToken();
    const headers = {'Content-Type':'application/json'};
    if(token) headers['Authorization'] = 'Bearer ' + token;

    try{
      const res = await fetch('/v1/messages', {
        method:'POST',
        headers: headers,
        body: JSON.stringify({
          type: 'user_message',
          session_id: getSessionID(),
          agent_id: 'default',
          text: text,
          client_msg_id: genMsgID()
        })
      });
      const data = await res.json();
      if(data.type === 'assistant_message'){
        addMessage(data.text, 'assistant');
      } else if(data.type === 'error'){
        addMessage(data.code + ': ' + data.message, 'error');
      } else {
        addMessage(JSON.stringify(data), 'assistant');
      }
    } catch(e) {
      addMessage('Network error: ' + e.message, 'error');
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      send();
    }
  });
  inputEl.addEventListener('input', function(){
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });

  inputEl.focus();
})();
</script>
</body>
</html>
